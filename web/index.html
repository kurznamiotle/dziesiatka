<!DOCTYPE html>
<html lang="pl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dziesiątka: dziesięć ciekawostek dziennie.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dziesiątka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dziesiątka</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Shown until Flutter paints its first frame. The colors match the backdrop
    of AppSurfaces in lib/views/app_theme.dart.
  -->
  <style>
    body {
      margin: 0;
      background-color: #E9E6F2;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0B0C11;
      }
    }

    html[data-theme="light"] body {
      background-color: #E9E6F2;
    }

    html[data-theme="dark"] body {
      background-color: #0B0C11;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #5C5A68;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    #loader img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(0.9);
        opacity: 0.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loader img {
        animation: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      #loader {
        color: #B1AFBD;
      }
    }

    html[data-theme="light"] #loader {
      color: #5C5A68;
    }

    html[data-theme="dark"] #loader {
      color: #B1AFBD;
    }
  </style>
  <script>
    // A theme chosen in the app wins over the system setting. shared_preferences
    // stores it on the web as JSON under the "flutter." prefix.
    try {
      var savedTheme = JSON.parse(localStorage.getItem('flutter.themeMode'));
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div id="loader" role="status">
    <img src="icons/Icon-192.png" alt="">
    <span id="loader-text">Wczytywanie…</span>
  </div>
  <script>
    // Flutter paints nothing for a few seconds on a phone, so the page says it
    // is working, and says so again on a slow connection.
    var slowLoading = setTimeout(function () {
      document.getElementById('loader-text').textContent =
        'Wolniejsze łącze, jeszcze chwila…';
    }, 8000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowLoading);
      document.getElementById('loader').remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
