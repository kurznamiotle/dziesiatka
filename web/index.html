<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dziesiątka: dziesięć ciekawostek dziennie.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dziesiątka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dziesiątka</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Shown until Flutter paints its first frame. The colors match the backdrop
    of AppSurfaces in lib/views/app_theme.dart.
  -->
  <style>
    body {
      margin: 0;
      background-color: #E9E6F2;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0B0C11;
      }
    }

    html[data-theme="light"] body {
      background-color: #E9E6F2;
    }

    html[data-theme="dark"] body {
      background-color: #0B0C11;
    }
  </style>
  <script>
    // A theme chosen in the app wins over the system setting. shared_preferences
    // stores it on the web as JSON under the "flutter." prefix.
    try {
      var savedTheme = JSON.parse(localStorage.getItem('flutter.themeMode'));
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (_) {}
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
