name: Strona i panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A running deployment is never cancelled, so a
# newer push waits for it instead of leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: mkdir public
      # Without a service worker, so a new version reaches everyone at once.
      - run: flutter build web --base-href /app/ --pwa-strategy=none --no-web-resources-cdn -o public/app
      - run: flutter build web -t lib/admin_main.dart --base-href /panel/ --pwa-strategy=none --no-web-resources-cdn -o public/panel
      # The panel stays out of search results, and only the login protects it.
      - run: sed -i 's#<head>#<head><meta name="robots" content="noindex">#' public/panel/index.html
      - run: cp -r website/. public/
      # The only upload in the workflow. Its default name, github-pages, is
      # the one deploy-pages looks for.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # A separate job starts only after the artifact is fully stored, which a
  # deploy step in the same job did not always wait for.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
