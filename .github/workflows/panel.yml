name: Strona i panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web -t lib/admin_main.dart --base-href /dziesiatka/panel/ --pwa-strategy=none
      # The panel stays out of search results, and only the login protects it.
      - run: sed -i 's#<head>#<head><meta name="robots" content="noindex">#' build/web/index.html
      - run: |
          mkdir public
          cp -r website/. public/
          cp -r build/web public/panel
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
